name: Build Debug APK and Create GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $1}')
          if [ "$JAVA_VERSION" = "1" ]; then
            JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F'.' '{print $2}')
          fi
          echo "Detected Java major version: $JAVA_VERSION"
          if [ -z "$JAVA_VERSION" ] || [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Java version 17 or newer is required, but found version $JAVA_VERSION."
            exit 1
          fi
          echo "Java version verification passed."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            KEYTOOL="$JAVA_HOME/bin/keytool"
            if [ ! -f "$KEYTOOL" ]; then
              KEYTOOL="keytool"
            fi
            "$KEYTOOL" -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            if [ ! -f "./debug.keystore" ]; then
              echo "Error: Failed to generate debug.keystore."
              exit 1
            fi
            echo "debug.keystore generated successfully."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected debug APK not found at $APK_PATH"
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty."
            exit 1
          fi
          echo "APK verification passed: $APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RUN_NUM="${{ github.run_number }}"
          REPO_NAME="${{ github.repository }}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g')
          ASSET_DIR=$(mktemp -d)
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${RUN_NUM}.apk"
          ASSET_PATH="$ASSET_DIR/$ASSET_FILENAME"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> $GITHUB_OUTPUT
          echo "asset_filename=$ASSET_FILENAME" >> $GITHUB_OUTPUT
          echo "Prepared release asset at $ASSET_PATH"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset not found or empty."
            exit 1
          fi
          RUN_NUM="${{ github.run_number }}"
          RUN_ATTEMPT="${{ github.run_attempt }}"
          TAG_NAME="debug-apk-build-${RUN_NUM}-${RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${RUN_NUM}"
          COMMIT_SHA="${{ github.sha }}"
          
          NOTES="This is an automatically generated debug APK.
          - Built by GitHub Actions
          - Run Number: ${RUN_NUM}
          - Run Attempt: ${RUN_ATTEMPT}
          - Source Commit SHA: ${COMMIT_SHA}
          - Intended for testing purposes
          - Not a Play Store production release
          - Signed only with a temporary debug keystore"

          echo "Creating GitHub Release $TAG_NAME..."
          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "$COMMIT_SHA" \
            --latest \
            "$ASSET_PATH"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RUN_NUM="${{ github.run_number }}"
          RUN_ATTEMPT="${{ github.run_attempt }}"
          TAG_NAME="debug-apk-build-${RUN_NUM}-${RUN_ATTEMPT}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "Release publishing succeeded!"
            gh release view "$TAG_NAME" || true
            REPO_URL="https://github.com/${{ github.repository }}"
            RELEASE_URL="$REPO_URL/releases/tag/$TAG_NAME"
            
            echo "### GitHub Release Published Successfully!" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** $TAG_NAME" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Title:** Debug APK Build #${RUN_NUM}" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page URL:** [View Release]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Asset Filename:** $ASSET_FILENAME" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded directly from the release **Assets** section above." >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact (`app-debug-apk`) is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "Warning: Release publishing failed or was skipped."
            echo "### Warning: GitHub Release Publishing Failed" >> $GITHUB_STEP_SUMMARY
            echo "The APK build and artifact upload succeeded, but automatic release publishing failed." >> $GITHUB_STEP_SUMMARY
            echo "The Actions artifact named `app-debug-apk` remains available in the workflow run summary." >> $GITHUB_STEP_SUMMARY
          fi
